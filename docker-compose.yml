# Production-style stack: Postgres, API, scheduled IBKR sync worker, and the web app behind nginx.
# Locally: open http://localhost:8080. On the droplet: put TLS in front of the "web" service
# (Caddy or certbot on the host) and set COOKIE_SECURE=true.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: logger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: logger
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logger"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://logger:${POSTGRES_PASSWORD}@db:5432/logger
    command: ["npx", "tsx", "scripts/migrate.ts"]
    depends_on: { db: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://logger:${POSTGRES_PASSWORD}@db:5432/logger
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://logger:${POSTGRES_PASSWORD}@db:5432/logger
    command: ["npx", "tsx", "src/worker.ts"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
